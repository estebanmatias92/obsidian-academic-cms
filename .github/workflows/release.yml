name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release assets
        run: |
          zip obsidian-academic-cms-${{ github.ref_name }}.zip main.js manifest.json versions.json
          ls -lh obsidian-academic-cms-*.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            main.js
            manifest.json
            versions.json
            obsidian-academic-cms-*.zip
          generate_release_notes: true
